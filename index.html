    function copyImageUrl(url) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(url).then(() => {
          alert("사진 주소가 복사되었습니다! ✨\n패들렛에서 [링크 🔗] 버튼을 누르고 붙여넣기 해보세요.");
        });
      } else {
        let textArea = document.createElement("textarea");
        textArea.value = url;
        textArea.style.position = "fixed";
        textArea.style.left = "-999999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          document.execCommand('copy');
          alert("사진 주소가 복사되었습니다! ✨\n패들렛에서 [링크 🔗] 버튼을 누르고 붙여넣기 해보세요.");

      }
    }

    function doSearch() {
      let query = document.getElementById('search-input').value.replace(/ /g, '');
      let resultData = null;
      let category = "";
      
      let isAskingMeaning = query.includes('뜻') || query.includes('뭐야') || query.includes('무엇이야') || query.includes('뭔가요') || query.includes('무엇인가요') || query.includes('의미');
      let foundInDictionary = false;

      if (isAskingMeaning) {
        for (let word in dictionary) {
          let noSpaceWord = word.replace(/ /g, '');
          if (query.includes(noSpaceWord)) {
            resultData = dictionary[word];
            foundInDictionary = true;
            break;
          }
        }
      }

      if (!foundInDictionary) {
        let matchedCategories = [];
        if(query.includes('날짜') || query.includes('언제') || query.includes('며칠') || query.includes('몇월')) matchedCategories.push("언제야?");
        if(query.includes('음식') || query.includes('먹') || query.includes('떡') || query.includes('죽') || query.includes('밥') || query.includes('화채') || query.includes('과일')) matchedCategories.push("어떤 음식을 먹어?");
        if(query.includes('놀이') || query.includes('놀') || query.includes('강강술래') || query.includes('윷놀이') || query.includes('씨름') || query.includes('쥐불놀이') || query.includes('널뛰기') || query.includes('그네뛰기') || query.includes('연날리기') || query.includes('소싸움')) matchedCategories.push("어떤 놀이를 해?");
        if(selectedHoliday === '설날' && (query.includes('덕담') || query.includes('인사') || query.includes('세배') || query.includes('좋은말') || query.includes('말추천'))) matchedCategories.push("어떤 덕담을 해?");
        if(selectedHoliday === '정월 대보름' && (query.includes('소원') || query.includes('빌'))) matchedCategories.push("어떤 소원을 빌어?");
        if(query.includes('풍습') || query.includes('하는일') || query.includes('어떤일') || query.includes('무슨일') || query.includes('무엇을해') || query.includes('뭘해') || query.includes('뭐해') || query.includes('일을해') || query.includes('할일')) matchedCategories.push("어떤 일을 해?");
        
        matchedCategories = [...new Set(matchedCategories)];

        if (matchedCategories.length >= 2) {
          document.getElementById('result-text').innerText = "한 번에 하나씩 차근차근 질문해 주세요!\n예를 들어:\n👉 " + selectedHoliday + "에는 " + matchedCategories[0] + "\n👉 " + selectedHoliday + "에는 " + matchedCategories[1] + "\n이렇게 두 번 물어보세요!";
          document.getElementById('image-container').style.display = 'none';
          document.getElementById('question-prompt').style.display = 'none';
          document.getElementById('example-questions').style.display = 'none';
          document.getElementById('result-area').style.display = 'block';
          return;
        } else if (matchedCategories.length === 1) {
          let cat = matchedCategories[0];
          if(cat === "언제야?") category = "날짜";
          if(cat === "어떤 음식을 먹어?") category = "음식";
          if(cat === "어떤 놀이를 해?") category = "놀이";
          if(cat === "어떤 덕담을 해?") category = "덕담";
          if(cat === "어떤 소원을 빌어?") category = "소원";
          if(cat === "어떤 일을 해?") category = "하는일";
          
          if(category !== "" && db[selectedHoliday][category]) {
            resultData = db[selectedHoliday][category];
          }
        }
      }

      const resultArea = document.getElementById('result-area');
      const resultText = document.getElementById('result-text');
      const imageContainer = document.getElementById('image-container');
      const promptText = document.getElementById('question-prompt');
      
      document.getElementById('example-questions').style.display = 'none';

      if(resultData) {
        resultText.innerText = resultData.text;
        
        imageContainer.innerHTML = ''; 
        if (resultData.images && resultData.images.length > 0) {
            resultData.images.forEach(function(imgData) {
                let cardHtml = '<div class="image-card">';
                cardHtml += '<img src="' + imgData.url + '" alt="관련 이미지">';
                if (imgData.title !== "") {
                    cardHtml += '<p class="image-title">' + imgData.title + '</p>';
                }
                cardHtml += '<button class="copy-btn" onclick="copyImageUrl(\'' + imgData.url + '\')">🔗 사진 주소 복사하기</button>';
                cardHtml += '</div>';
                imageContainer.innerHTML += cardHtml;
            });
            imageContainer.style.display = 'flex';
        } else {
            imageContainer.style.display = 'none';
        }
        
        promptText.style.display = 'block';
      } else {
        let exampleMsg = "";
        if(selectedHoliday === '설날') exampleMsg = "예: 설날에 할 만한 덕담은 뭐가 있을까?";
        if(selectedHoliday === '정월 대보름') exampleMsg = "예: 정월 대보름에 사람들은 어떤 소원을 빌어?";
        if(selectedHoliday === '단오') exampleMsg = "예: 단오에는 어떤 놀이를 해?";
        if(selectedHoliday === '추석') exampleMsg = "예: 추석에는 어떤 음식을 먹어?";
        if(selectedHoliday === '동지') exampleMsg = "예: 동지 날짜는 언제야?";
        
        resultText.innerText = "질문을 조금 더 구체적으로 해 줄래요? 🥺\n👉 " + exampleMsg;
        imageContainer.style.display = 'none';
        promptText.style.display = 'none';
      }
      
      resultArea.style.display = 'block';
    }
  </script>

</body></html>
